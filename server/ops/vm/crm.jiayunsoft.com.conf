# Dedicated CRM virtual host. Keep the application bound to loopback.
# Install only after checking the existing virtual hosts, ports and DNS.
server {
    listen 80;
    server_name crm.jiayunsoft.com;
    return 301 https://crm.jiayunsoft.com$request_uri;
}

server {
    listen 443 ssl;
    server_name crm.jiayunsoft.com;

    ssl_certificate /etc/nginx/ssl/binbin-crm/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/binbin-crm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BINBIN_CRM_SSL:5m;
    ssl_session_timeout 10m;
    client_max_body_size 6m;

    access_log /var/log/nginx/binbin-crm-access.log;
    error_log /var/log/nginx/binbin-crm-error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host crm.jiayunsoft.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
